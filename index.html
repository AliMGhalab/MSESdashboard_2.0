<script>
  const DASHBOARD_PASSWORD = "ward2024";

  const firebaseConfig = {
    apiKey: "AIzaSyCePnTRSWFX-R0n4iIMLHIr0PZjk-WcHco",
    authDomain: "msesalert-b972d.firebaseapp.com",
    databaseURL: "https://msesalert-b972d-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "msesalert-b972d",
    storageBucket: "msesalert-b972d.firebasestorage.app",
    messagingSenderId: "992963491194",
    appId: "1:992963491194:web:f0d0b95343114e067e52c3"
  };

  firebase.initializeApp(firebaseConfig);

  const db = firebase.database();
  const alarm = document.getElementById('alarmSound');

  let historyData = [];
  let prevState = {};

  let dailyMetrics = {
    system1Count: 0,
    system2Count: 0,
    system3Count: 0,
    nurseCalls: 0,
    degradedSystems: [],
    startTime: new Date()
  };

  function primeSystems() {
    alarm.volume = 0;

    alarm.play().then(() => {
      alarm.pause();
      alarm.currentTime = 0;
      alarm.volume = 1;
    }).catch(() => {});

    if ("vibrate" in navigator) {
      navigator.vibrate(20);
    }
  }

  function startAlarm() {
    if (!alarm.paused) return;

    alarm.play().catch(() => {});

    if ("vibrate" in navigator) {
      navigator.vibrate([500, 200, 500, 200, 500]);
    }
  }

  function stopAlarm() {
    alarm.pause();
    alarm.currentTime = 0;

    if ("vibrate" in navigator) {
      navigator.vibrate(0);
    }
  }

  function attemptLogin() {
    const pw = document.getElementById('pw-input').value;

    if (pw === DASHBOARD_PASSWORD) {

      sessionStorage.setItem('auth', '1');

      primeSystems();

      showDashboard();

    } else {

      document.getElementById('login-err').textContent =
        'Incorrect password.';
    }
  }

  function showDashboard() {
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('dashboard').classList.add('visible');

    startListeners();

    checkNotifPermission();
  }

  function logout() {
    sessionStorage.removeItem('auth');
    location.reload();
  }

  window.addEventListener('load', () => {

    if (sessionStorage.getItem('auth') === '1') {
      showDashboard();
    }

  });

  function updateDB(path, val) {
    db.ref(path).set(val);
  }

  function resetAll() {
    updateDB('system1', 0);
    updateDB('system2', 0);
    updateDB('system3', 0);
    updateDB('nurse_call', 0);
  }

  function addLog(message, type = 'alert') {

    const logDiv = document.getElementById('logs');

    const now = new Date().toLocaleTimeString('en-GB');

    const cls =
      type === 'ok'
        ? 'log-ok'
        : type === 'info'
        ? 'log-info'
        : 'log-alert';

    const entry = `
      <div class="log-entry">
        <span class="log-time">[${now}]</span>
        <span class="${cls}">${message}</span>
      </div>
    `;

    logDiv.innerHTML = entry + logDiv.innerHTML;

    historyData.unshift({
      time: now,
      event: message,
      status: type.toUpperCase()
    });

    updateHistoryTable();
    updateQualityMetrics();
  }

  function updateHistoryTable() {

    const body = document.getElementById('history-body');

    body.innerHTML = historyData
      .slice(0, 50)
      .map(item => `
        <tr>
          <td>${item.time}</td>
          <td>${item.event}</td>
          <td>${item.status}</td>
        </tr>
      `)
      .join('');
  }

  function updateQualityMetrics() {

    const totalAlerts =
      dailyMetrics.system1Count +
      dailyMetrics.system2Count +
      dailyMetrics.system3Count +
      dailyMetrics.nurseCalls;

    let quality = Math.max(0, 100 - totalAlerts * 5);

    document.getElementById('quality-score').textContent =
      quality + "%";

    document.getElementById('alert-count').textContent =
      totalAlerts;

    let worst = "All Clear";
    let max = 0;

    const systems = [
      { name: "Air Quality", val: dailyMetrics.system1Count },
      { name: "Temperature", val: dailyMetrics.system2Count },
      { name: "Sterilization", val: dailyMetrics.system3Count }
    ];

    systems.forEach(s => {
      if (s.val > max) {
        max = s.val;
        worst = s.name;
      }
    });

    document.getElementById('worst-system').textContent = worst;

    const risk =
      totalAlerts === 0
        ? "LOW"
        : totalAlerts < 5
        ? "MODERATE"
        : "HIGH";

    const riskColor =
      risk === "LOW"
        ? "var(--success)"
        : risk === "MODERATE"
        ? "var(--warn)"
        : "var(--danger)";

    const riskLevel = document.getElementById('risk-level');

    riskLevel.textContent = risk;
    riskLevel.style.color = riskColor;

    document.getElementById('quality-note').textContent =
      totalAlerts === 0
        ? "No alerts today. System performing nominally."
        : `Detected ${totalAlerts} system alerts today. Continuous monitoring recommended.`;
  }

  function startListeners() {

    const systems = [
      'system1',
      'system2',
      'system3',
      'nurse_call'
    ];

    systems.forEach(system => {

      db.ref(system).on('value', snapshot => {

        const value = snapshot.val();

        if (prevState[system] === value) return;

        prevState[system] = value;

        handleSystemUpdate(system, value);

      });

    });
  }

  function handleSystemUpdate(system, value) {

    const badgeMap = {
      system1: 's1_badge',
      system2: 's2_badge',
      system3: 's3_badge',
      nurse_call: 'nurse_badge'
    };

    const badge = document.getElementById(badgeMap[system]);

    if (value == 1) {

      badge.className =
        system === 'nurse_call'
          ? 'badge badge-call'
          : 'badge badge-breach';

      badge.textContent =
        system === 'nurse_call'
          ? 'CALL ACTIVE'
          : 'ALERT ACTIVE';

      startAlarm();

      addLog(`${system} triggered`, 'alert');

      if (system === 'system1') dailyMetrics.system1Count++;
      if (system === 'system2') dailyMetrics.system2Count++;
      if (system === 'system3') dailyMetrics.system3Count++;
      if (system === 'nurse_call') dailyMetrics.nurseCalls++;

    } else {

      badge.className = 'badge badge-secure';

      badge.textContent =
        system === 'nurse_call'
          ? 'IDLE'
          : 'NORMAL ✓';

      stopAlarm();

      addLog(`${system} restored`, 'ok');
    }
  }

  async function analyzeWithOllama(historyData) {

    const output =
      document.getElementById("ollama-result");

    output.innerHTML =
      "Analyzing ward history...";

    try {

      const summary = historyData.length
        ? historyData
            .slice(0, 15)
            .map(e =>
              `${e.time} | ${e.event} | ${e.status}`
            )
            .join("\n")
        : "No alerts recorded.";

      const prompt = `
You are an AI hospital monitoring assistant.

Analyze these ward logs and provide:

1. Risk level
2. Most problematic system
3. Recommended action
4. Technical summary

Logs:
${summary}
`;

      const response = await fetch(
        "http://localhost:11434/api/generate",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "llama3",
            prompt: prompt,
            stream: false
          })
        }
      );

      if (!response.ok) {
        throw new Error("Ollama API failed");
      }

      const data = await response.json();

      output.innerHTML = `
        <div style="color:#00e676;font-weight:bold;margin-bottom:10px;">
          AI ANALYSIS COMPLETE
        </div>

        <div style="white-space:pre-wrap;line-height:1.5;color:#8ab0cc;">
${data.response}
        </div>
      `;

    } catch (err) {

      console.error(err);

      output.innerHTML = `
        <div style="color:#ff3b5c;">
          Ollama connection failed
        </div>

        <br>

        Make sure:
        <br>• Ollama is running
        <br>• llama3 is installed
        <br>• localhost:11434 is accessible
      `;
    }
  }

  function exportCSV() {

    let csv =
      "Timestamp,Event,Status\n";

    historyData.forEach(item => {

      csv +=
        `"${item.time}","${item.event}","${item.status}"\n`;

    });

    const blob = new Blob(
      [csv],
      { type: "text/csv" }
    );

    const a = document.createElement('a');

    a.href = URL.createObjectURL(blob);

    a.download = "ward_logs.csv";

    a.click();
  }

  function requestNotifPermission() {

    Notification.requestPermission()
      .then(permission => {

        if (permission === "granted") {

          document
            .getElementById('notif-bar')
            .classList.add('hidden');
        }

      });
  }

  function checkNotifPermission() {

    if (Notification.permission === "granted") {

      document
        .getElementById('notif-bar')
        .classList.add('hidden');
    }
  }

  setInterval(() => {

    document.getElementById('clock').textContent =
      new Date().toLocaleTimeString('en-GB');

  }, 1000);

</script>
